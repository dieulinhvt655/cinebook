# Weekly dependency PRs, grouped so minor/patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    # The design targets Spring Boot 3; moving to Boot 4 (and springdoc 3, which needs it) is a
    # planned migration of its own, not an automatic bump.
    ignore:
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.spring.dependency-management"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
