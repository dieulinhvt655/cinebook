name: backend

# Reusable: called from ci.yml, which decides when it runs and gates merges via the ci-ok job.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Integration tests start PostgreSQL 16 with Testcontainers (Docker is preinstalled on the runner),
      # so Flyway migrations, partial unique index and EXCLUDE constraint are checked on every push.
      - run: ./gradlew test bootJar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
