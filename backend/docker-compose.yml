# Local development database. Start: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: cinebook-postgres
    environment:
      POSTGRES_DB: cinebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinebook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
