server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cinebook
  profiles:
    # Local runs default to dev (seed + migrator role). Render sets SPRING_PROFILES_ACTIVE=prod|demo.
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinebook}
    username: ${DB_APP_USERNAME:cinebook_app}
    password: ${DB_APP_PASSWORD:cinebook_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC

cinebook:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  qr:
    hmac-key: ${QR_HMAC_KEY:}
  booking:
    hold-ttl: PT10M
    sales-cutoff: PT15M
    max-seats: 8
    expiry-job-interval: PT30S
  cloudinary:
    url: ${CLOUDINARY_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
