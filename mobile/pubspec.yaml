name: cinebook
description: CineBook - movie ticket booking app (Bloc + Clean Architecture).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  # DI & navigation
  get_it: ^9.3.0
  go_router: ^18.1.4
  # Network & models
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # Storage
  flutter_secure_storage: ^11.2.0
  # UI
  cached_network_image: ^4.0.7
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^4.0.3
  json_serializable: ^6.11.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Be Vietnam Pro, bundled (not fetched at runtime). Run tool/fetch_fonts.sh once to download.
  # Be Vietnam Pro, bundled (not fetched at runtime). Run tool/fetch_fonts.sh once to download.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
